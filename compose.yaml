name: gamegrub

services:
  db:
    image: mariadb:10.11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${MARIADB_DATABASE:-gamegrub2}
      MARIADB_USER: ${MARIADB_USER:-gamegrub}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:-gamegrub_dev_password}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-gamegrub_root_password}
      TZ: UTC
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
    ports:
      - "${MARIADB_HOST_PORT:-3307}:3306"
    volumes:
      - database_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/001-gamegrub-baseline.sql:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mariadb-admin ping -h 127.0.0.1 -uroot -p$${MARIADB_ROOT_PASSWORD} --silent",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      PORT: 3001
      HOST: 0.0.0.0
      NODE_ENV: development
      APP_ENV: development
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_SERVICE_NAME: gamegrub-backend
      OPS_ALERT_WEBHOOK_URL: ${OPS_ALERT_WEBHOOK_URL:-}
      OPS_ALERT_WEBHOOK_SECRET: ${OPS_ALERT_WEBHOOK_SECRET:-}
      OPS_METRICS_WINDOW_MINUTES: ${OPS_METRICS_WINDOW_MINUTES:-5}
      OPS_API_ERROR_THRESHOLD: ${OPS_API_ERROR_THRESHOLD:-5}
      OPS_PAYMENT_FAILURE_THRESHOLD: ${OPS_PAYMENT_FAILURE_THRESHOLD:-3}
      OPS_ALERT_COOLDOWN_MINUTES: ${OPS_ALERT_COOLDOWN_MINUTES:-15}
      ENABLE_IN_PROCESS_CRON: ${ENABLE_IN_PROCESS_CRON:-true}
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: ${MARIADB_USER:-gamegrub}
      DB_PASSWORD: ${MARIADB_PASSWORD:-gamegrub_dev_password}
      DB_NAME: ${MARIADB_DATABASE:-gamegrub2}
      DB_MIGRATIONS_TABLE: schema_migrations
      DB_CONNECTION_LIMIT: 10
      DB_SSL: "false"
      JWT_SECRET: ${JWT_SECRET:-local-development-jwt-secret-change-before-production}
      JWT_ACCESS_TOKEN_EXPIRES_IN: 12h
      REFRESH_TOKEN_TTL_DAYS: 30
      OTP_PEPPER: ${OTP_PEPPER:-local-development-otp-pepper-change-before-production}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-no-reply@gamegrub.local}
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5-mini}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
      RAZORPAY_API_BASE_URL: ${RAZORPAY_API_BASE_URL:-https://api.razorpay.com/v1}
      PAYMENT_CURRENCY: ${PAYMENT_CURRENCY:-INR}
      PAYMENT_CHECKOUT_PUBLIC_URL: ${PAYMENT_CHECKOUT_PUBLIC_URL:-}
      FIREBASE_SERVICE_ACCOUNT_JSON: "${FIREBASE_SERVICE_ACCOUNT_JSON:-}"
      FIREBASE_WEB_VAPID_KEY: ${FIREBASE_WEB_VAPID_KEY:-}
      USER_APP_PUBLIC_URL: ${USER_APP_PUBLIC_URL:-http://localhost:3002}
      UPLOAD_STORAGE: local
      UPLOADS_DIR: uploads
    command: ["sh", "-c", "npm run migrate && npm start"]
    ports:
      - "${BACKEND_PORT:-3001}:3001"
    volumes:
      - backend_uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  admin:
    build:
      context: ./gamegrubadmin
      args:
        VITE_API_ROOT_URL: http://localhost:${BACKEND_PORT:-3001}
    restart: unless-stopped
    ports:
      - "${ADMIN_PORT:-3000}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O /dev/null http://127.0.0.1/ || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 40s

  user-web:
    build:
      context: ./gamegrub_user
      args:
        API_ROOT_URL: http://localhost:${BACKEND_PORT:-3001}
        FIREBASE_API_KEY: ${FIREBASE_API_KEY:-}
        FIREBASE_APP_ID_WEB: ${FIREBASE_APP_ID_WEB:-}
        FIREBASE_MESSAGING_SENDER_ID: ${FIREBASE_MESSAGING_SENDER_ID:-}
        FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
        FIREBASE_AUTH_DOMAIN: ${FIREBASE_AUTH_DOMAIN:-}
        FIREBASE_STORAGE_BUCKET: ${FIREBASE_STORAGE_BUCKET:-}
    restart: unless-stopped
    ports:
      - "${USER_WEB_PORT:-3002}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O /dev/null http://127.0.0.1/ || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"

  phpmyadmin:
    image: phpmyadmin:5.2-apache
    restart: unless-stopped
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      UPLOAD_LIMIT: 128M
    ports:
      - "${PHPMYADMIN_PORT:-8080}:80"
    depends_on:
      db:
        condition: service_healthy

volumes:
  database_data:
  backend_uploads:
