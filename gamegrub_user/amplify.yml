version: 1
frontend:
  phases:
    preBuild:
      commands:
        - if [ ! -d "$HOME/flutter" ]; then git clone https://github.com/flutter/flutter.git --depth 1 -b stable "$HOME/flutter"; fi
        - export PATH="$HOME/flutter/bin:$PATH"
        - flutter config --enable-web
        - flutter pub get
    build:
      commands:
        - export PATH="$HOME/flutter/bin:$PATH"
        - flutter build web --release --dart-define=API_ROOT_URL=$API_ROOT_URL
  artifacts:
    baseDirectory: build/web
    files:
      - '**/*'
  cache:
    paths:
      - $HOME/.pub-cache/**/*
      - $HOME/flutter/**/*
